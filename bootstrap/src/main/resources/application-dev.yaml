spring:
  datasource:
    url: ${DB_URL}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  endpoint:
    health:
      show-details: always

jwt:
  secret-key: ${JWT_SECRET_KEY}

kakao:
  app-key: ${KAKAO_APP_KEY}

apple:
  client-id: ${APPLE_CLIENT_ID}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    # dev에는 CloudFront가 없어 기본값은 S3 원본 주소다.
    public-base-url: ${IMAGE_PUBLIC_BASE_URL:https://${aws.s3.bucket}.s3.${aws.s3.region}.amazonaws.com}

fcm:
  credentials-path: file:/app/parfait-firebase-key.json
