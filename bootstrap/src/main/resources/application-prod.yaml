spring:
  datasource:
    url: ${DB_URL}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

management:
  endpoint:
    health:
      show-details: never

jwt:
  secret-key: ${JWT_SECRET_KEY}

kakao:
  app-key: ${KAKAO_APP_KEY}

apple:
  client-id: ${APPLE_CLIENT_ID}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    # CloudFront(cdn.parfait-app.store). 기본값을 두지 않아 .env에 없으면 기동이 실패한다.
    public-base-url: ${IMAGE_PUBLIC_BASE_URL}

fcm:
  credentials-path: file:/app/parfait-firebase-key.json
