  <script>
    // Android 일반 브라우저는 페이지가 그려지기 전에 스토어로 보낸다. React보다 먼저 실행돼야 한다.
    // 이 스크립트는 src/landing/ua.ts의 landingView().autoRedirect와 같아야 한다.
    // src/landing/inlineScript.test.ts가 그것을 확인한다. ES5로만 쓴다.
    // 받아들인 차이(스펙 3장): UA에 Macintosh와 Android가 함께 있는 터치 기기는 detectPlatform이 터치 수를 보고 iOS로 판정하지만, 여기서는 터치 수를 보지 않고 스토어로 보낸다.
    (function () {
      var ua = navigator.userAgent || "";
      if (/iPhone|iPad|iPod/i.test(ua)) return;
      var isAndroid = /Android/i.test(ua);
      var isInApp = /Instagram|FBAN|FBAV|FB_IAB|KAKAOTALK|NAVER|Line\/|Threads/i.test(ua);
      if (!isAndroid || isInApp) return;
      var referrer = "";
      try {
        // ua.ts의 campaignReferrer와 같은 절차다. 디코딩하지 않는다.
        var keys = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "utm_id"];
        var valid = /^[A-Za-z0-9._~-]{1,100}$/;
        var noHash = String(location.href).split("#")[0];
        var q = noHash.indexOf("?");
        if (q >= 0) {
          var pieces = noHash.slice(q + 1).split("&");
          var found = {};
          var i, k;
          for (i = 0; i < pieces.length; i++) {
            var eq = pieces[i].indexOf("=");
            if (eq < 0) continue;
            var key = pieces[i].slice(0, eq);
            var known = false;
            for (k = 0; k < keys.length; k++) {
              if (keys[k] === key) known = true;
            }
            if (!known) continue;
            // 같은 key는 첫 조각만 본다. 틀렸으면 그 key는 없는 것이다.
            if (Object.prototype.hasOwnProperty.call(found, key)) continue;
            var value = pieces[i].slice(eq + 1);
            found[key] = valid.test(value) ? value : null;
          }
          if (found.utm_source) {
            var parts = [];
            for (k = 0; k < keys.length; k++) {
              if (found[keys[k]]) parts.push(keys[k] + "=" + found[keys[k]]);
            }
            referrer = parts.join("&");
          }
        }
      } catch (e) {
        referrer = "";
      }
      var pkg = "com.teamyg.parfait";
      var ref = referrer ? "&referrer=" + encodeURIComponent(referrer) : "";
      var webUrl = "https://play.google.com/store/apps/details?id=" + pkg + ref;
      location.replace(
        "intent://details?id=" + pkg + ref +
        "#Intent;scheme=market;package=com.android.vending;" +
        "S.browser_fallback_url=" + encodeURIComponent(webUrl) + ";end"
      );
    })();
  </script>
