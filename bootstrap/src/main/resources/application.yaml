spring:
  application:
    name: parfait
  jackson:
    default-property-inclusion: always
  profiles:
    default: local
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # 스키마는 Flyway가 단독으로 소유한다. update로 두면 마이그레이션 누락을 Hibernate가
      # 조용히 덮어써 드리프트가 쌓이므로(#110), 검증만 하고 변경은 하지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: Asia/Seoul
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      # Spring Batch 메타테이블은 V12가 소유한다. always로 두면 Flyway와 이중 초기화가 된다.
      initialize-schema: never

jwt:
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600
  registration-token-expiration-seconds: 600

kakao:
  issuer: https://kauth.kakao.com
  jwks-uri: https://kauth.kakao.com/.well-known/jwks.json

apple:
  issuer: https://appleid.apple.com
  jwks-uri: https://appleid.apple.com/auth/keys

aws:
  s3:
    region: ap-northeast-2
    presigned-url-expiration-seconds: 900

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
