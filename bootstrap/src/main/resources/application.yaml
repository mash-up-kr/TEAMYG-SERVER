server:
  # TLS는 앞단 Caddy가 종단하고 평문 8080으로 프록시한다. 이 설정이 없으면 애플리케이션이 스킴을
  # http로 인식해 Swagger UI가 광고하는 서버 URL 등 절대 경로가 http://로 나가고 브라우저가 막는다.
  # X-Forwarded-* 를 무조건 신뢰하므로, 8080은 반드시 외부에 닫아 둔다(docs/operations/https-setup.md).
  forward-headers-strategy: framework

spring:
  application:
    name: parfait
  jackson:
    default-property-inclusion: always
  profiles:
    default: local
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # 스키마는 Flyway가 단독으로 소유한다. update로 두면 마이그레이션 누락을 Hibernate가
      # 조용히 덮어써 드리프트가 쌓이므로(#110), 검증만 하고 변경은 하지 않는다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: Asia/Seoul
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      # Spring Batch 메타테이블은 V12가 소유한다. always로 두면 Flyway와 이중 초기화가 된다.
      initialize-schema: never
  task:
    scheduling:
      pool:
        # 기본 풀은 1. OutboxRetentionSweeper(04:00)·ParfaitCanvasRotationScheduler(03:00) 가
        # 그 스레드를 점유하면 OutboxPollingWorker.tick() 이 밀려 재시도 예약 행이 지연된다.
        size: 2

jwt:
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600
  registration-token-expiration-seconds: 600

kakao:
  issuer: https://kauth.kakao.com
  jwks-uri: https://kauth.kakao.com/.well-known/jwks.json

apple:
  issuer: https://appleid.apple.com
  jwks-uri: https://appleid.apple.com/auth/keys

aws:
  s3:
    region: ap-northeast-2
    presigned-url-expiration-seconds: 900

fcm:
  credentials-path: classpath:fcm/local-firebase-key.json

notification:
  outbox:
    poll-interval-ms: 2000
    retention-days: 7
    purge-cron: "0 0 4 * * *"
  reminder:
    morning-cron: "0 0 10 * * *"
    evening-cron: "0 0 20 * * *"

# App Links(Android)/Universal Links(iOS) 자체구현용 설정. docs 루트의 deeplink-selfbuild-plan.md 참고.
deeplink:
  domain: parfait-app.store
  android:
    package-name: com.teamyg.parfait
    # debug 키스토어 지문 + release(Play 앱 서명 키) 지문. 둘 다 등록해야 debug/release 빌드 모두
    # App Links 검증(Digital Asset Links)을 통과한다.
    sha256-cert-fingerprints: "4F:7D:A7:E9:92:71:2E:1E:D3:AF:3F:CF:64:85:08:05:25:9D:E7:7A:5B:E4:80:96:B0:40:1D:1E:09:44:79:4F,46:77:8E:EC:B8:36:90:86:B1:33:29:00:96:15:35:75:AE:13:14:B6:3D:DA:FC:19:0C:B7:78:9E:ED:B3:50:73"
  ios:
    team-id: "" # TODO: Apple Developer Team ID
    bundle-id: "" # TODO: iOS 앱 Bundle ID
    app-store-id: "" # TODO: App Store Connect 앱 고유 숫자 ID (비워두면 iOS 폴백 페이지가 스토어로 리다이렉트하지 않는다)
  ga4:
    measurement-id: "" # TODO: GA4 Web 데이터 스트림 측정 ID (G-XXXXXXXXXX, 비워두면 이벤트 전송을 건너뛴다)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
