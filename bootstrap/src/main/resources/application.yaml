spring:
  application:
    name: parfait
  jackson:
    default-property-inclusion: always
  profiles:
    default: local
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: Asia/Seoul
        order_inserts: true
        order_updates: true
  flyway:
    enabled: false
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      # flyway가 꺼져 있어(V12 미적용) Spring Batch 메타테이블이 어디서도 생성되지 않는 문제의 stopgap.
      # flyway.enabled를 true로 되돌리면 V12와 중복 초기화될 수 있으니 그때 이 설정도 함께 재검토할 것.
      initialize-schema: always

jwt:
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600
  registration-token-expiration-seconds: 600

kakao:
  issuer: https://kauth.kakao.com
  jwks-uri: https://kauth.kakao.com/.well-known/jwks.json

apple:
  issuer: https://appleid.apple.com
  jwks-uri: https://appleid.apple.com/auth/keys

aws:
  s3:
    region: ap-northeast-2
    presigned-url-expiration-seconds: 900

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
