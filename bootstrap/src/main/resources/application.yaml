spring:
  application:
    name: parfait
  jackson:
    default-property-inclusion: always
  profiles:
    default: local
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: Asia/Seoul
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600
  registration-token-expiration-seconds: 600

kakao:
  issuer: https://kauth.kakao.com
  jwks-uri: https://kauth.kakao.com/.well-known/jwks.json

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health
