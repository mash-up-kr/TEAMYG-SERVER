name: Rollback App

# 서버에 남아 있는 이전 이미지로 parfait 컨테이너를 되돌린다.
#   mode=list      서버의 이미지 목록과 현재 실행 중인 이미지를 출력한다 (서버 변경 없음).
#   mode=rollback  image에 지정한 이미지로 컨테이너를 교체한다.
#
# 주의: 롤백해도 main에는 문제 커밋이 남아 있다. main에서 해당 변경을 revert하지 않으면
#       다음 배포가 문제 버전을 다시 올린다.
# 주의: 서버에서 실행되는 로직과 docker run 옵션은 deploy/scripts/rollback-app.sh에 있으며
#       .github/workflows/deploy.yml과 같아야 한다.
# 주의: workflow_dispatch는 기본 브랜치에 이 파일이 있어야 Actions 탭에 나타난다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list: 이미지 목록 조회 / rollback: 지정한 이미지로 교체"
        type: choice
        options:
          - list
          - rollback
        default: list
      image:
        description: "rollback 대상 이미지 ID (list로 확인, 12~64자리 소문자 16진수)"
        type: string
        required: false

# rollback 모드만 배포(deploy.yml)와 같은 그룹을 써서 동시에 실행되지 않게 한다.
# 같은 그룹은 실행 1개 + 대기 1개만 허용하므로, 대기 중에 새 실행이 들어오면 이전 대기 실행은 취소된다.
# mode=list는 서버를 바꾸지 않으므로 그룹에서 제외해 대기 중인 배포를 취소시키지 않는다.
concurrency:
  group: ${{ inputs.mode == 'rollback' && 'server-deploy' || format('rollback-list-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 입력값은 환경변수로만 전달하고, 검증은 서버에서 쓰는 스크립트와 같은 규칙(validate)을 쓴다.
      - name: Validate inputs
        id: validate
        env:
          MODE: ${{ inputs.mode }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "rollback" ]; then
            ID="$(bash deploy/scripts/rollback-app.sh validate "$IMAGE")"
            echo "args=rollback $ID" >> "$GITHUB_OUTPUT"
          else
            echo "args=list" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Run on server via SSM
        id: ssm
        env:
          ARGS: ${{ steps.validate.outputs.args }}
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=parfait-server" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          # 스크립트를 base64로 실어 보내 서버에서 파일로 풀어 실행한다 (인용부호 이스케이프 회피).
          # 스크립트 종료 코드가 SSM 결과에 반영되도록 정리 후 같은 코드로 종료한다.
          B64=$(base64 < deploy/scripts/rollback-app.sh | tr -d '\n')
          jq -n --arg b64 "$B64" --arg args "$ARGS" '{commands: [
            "f=$(mktemp) && echo \($b64) | base64 -d > \"$f\" && bash \"$f\" \($args); rc=$?; rm -f \"$f\"; exit $rc"
          ]}' > "$RUNNER_TEMP/ssm-params.json"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "file://$RUNNER_TEMP/ssm-params.json" \
            --query "Command.CommandId" \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Check result
        run: |
          # deploy.yml과 같은 이유로 aws ssm wait 대신 종료 상태가 나올 때까지 직접 폴링한다.
          # 롤백은 헬스체크 재시도(최대 150초)를 포함하므로 최대 5분 대기한다.
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id ${{ steps.ssm.outputs.command_id }} \
              --instance-id ${{ steps.ssm.outputs.instance_id }} \
              --query "Status" --output text)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          echo "Status: $STATUS"
          echo "---- stdout ----"
          aws ssm get-command-invocation \
            --command-id ${{ steps.ssm.outputs.command_id }} \
            --instance-id ${{ steps.ssm.outputs.instance_id }} \
            --query "StandardOutputContent" --output text
          echo "---- stderr ----"
          aws ssm get-command-invocation \
            --command-id ${{ steps.ssm.outputs.command_id }} \
            --instance-id ${{ steps.ssm.outputs.instance_id }} \
            --query "StandardErrorContent" --output text

          [ "$STATUS" = "Success" ]
