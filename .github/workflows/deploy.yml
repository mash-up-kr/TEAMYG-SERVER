name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t parfait .
          docker tag parfait:latest 452203592903.dkr.ecr.ap-northeast-2.amazonaws.com/parfait:latest
          docker push 452203592903.dkr.ecr.ap-northeast-2.amazonaws.com/parfait:latest

      - name: Deploy on EC2 via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=parfait-server" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          
          aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 452203592903.dkr.ecr.ap-northeast-2.amazonaws.com",
              "docker stop parfait || true",
              "docker rm parfait || true",
              "docker pull 452203592903.dkr.ecr.ap-northeast-2.amazonaws.com/parfait:latest",
              "docker run -d --name parfait -p 8080:8080 --env-file /home/ubuntu/TEAMYG-SERVER/.env --restart always 452203592903.dkr.ecr.ap-northeast-2.amazonaws.com/parfait:latest"
            ]'