name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t parfait .
          docker tag parfait:latest 452203592903.dkr.ecr.ap-northeast-2.amazonaws.com/parfait:latest
          docker push 452203592903.dkr.ecr.ap-northeast-2.amazonaws.com/parfait:latest

      - name: Deploy on EC2 via SSM
        id: deploy
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=parfait-server" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo aws ecr get-login-password --region ap-northeast-2 | sudo docker login --username AWS --password-stdin 452203592903.dkr.ecr.ap-northeast-2.amazonaws.com",
              "sudo docker stop parfait || true",
              "sudo docker rm parfait || true",
              "sudo docker pull 452203592903.dkr.ecr.ap-northeast-2.amazonaws.com/parfait:latest",
              "sudo docker run -d --name parfait --network host --env-file /home/ubuntu/TEAMYG-SERVER/.env --restart always 452203592903.dkr.ecr.ap-northeast-2.amazonaws.com/parfait:latest",
              "for i in $(seq 1 30); do curl -sf --max-time 2 http://localhost:8080/health && exit 0; [ $i -lt 30 ] && sleep 5; done; echo Health check failed; exit 1"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Check deploy result
        run: |
          # aws ssm wait command-executed의 기본 대기시간(delay 2초 × 최대 20회 ≈ 40초)은
          # ECR 로그인·docker pull·헬스체크 재시도(최대 150초)를 포함하는 배포 커맨드보다
          # 훨씬 짧아 항상 InProgress 상태에서 타임아웃난다. 종료 상태가 나올 때까지 직접 폴링한다.
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id ${{ steps.deploy.outputs.command_id }} \
              --instance-id ${{ steps.deploy.outputs.instance_id }} \
              --query "Status" --output text)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id ${{ steps.deploy.outputs.command_id }} \
            --instance-id ${{ steps.deploy.outputs.instance_id }} \
            --query "{Status:Status, Out:StandardOutputContent, Err:StandardErrorContent}"

          [ "$STATUS" = "Success" ]
