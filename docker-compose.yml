services:
  mysql:
    image: mysql:8.4
    container_name: parfait-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: parfait
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - "3306:3306"
    volumes:
      - parfait-mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: parfait-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - parfait-redis-data:/data

volumes:
  parfait-mysql-data:
  parfait-redis-data:
